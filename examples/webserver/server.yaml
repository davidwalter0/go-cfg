# Example server configuration file
# Use with: go run main.go --config-file=server.yaml

host: "0.0.0.0"
port: 8080
environment: "production"
debug: false

# TLS Configuration
enable_tls: false
# tls_cert_file: "/path/to/cert.pem"
# tls_key_file: "/path/to/key.pem"

# Timeouts
read_timeout: "30s"
write_timeout: "30s"
idle_timeout: "120s"

# Features
enable_metrics: true
enable_logging: true
enable_cors: true

# Logging
log_level: "info"