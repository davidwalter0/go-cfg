api:
    enabletls: false
    host: 0.0.0.0
    port: 8080
    ratelimit: 1000
    timeout: 30s
database:
    conntimeout: 5s
    host: localhost
    maxconns: 10
    name: ""
    password: ""
    port: 5432
    querytimeout: 30s
    sslmode: prefer
    username: ""
discovery:
    enabled: false
    endpoints:
      - consul:8500
      - etcd:2379
      - consul:8500
      - etcd:2379
    namespace: default
environment: development
features:
    auth: true
    caching: true
    metrics: true
    tracing: false
logging:
    format: json
    level: info
    maxbackups: 3
    maxsize: 100
    output: stdout
metrics:
    enabled: true
    endpoint: /metrics
    interval: 15s
    port: 9090
nodeid: ""
resources:
    maxcpu: 2
    maxmemorymb: 512
    timeout: 5m0s
security:
    corsorigins:
      - '*'
      - '*'
    enablecors: true
    jwtexpiration: 24h0m0s
    jwtsecret: ""
    ratelimit:
        burst: 200
        enabled: true
        rps: 100
servicename: david
services: {}
tracing:
    enabled: false
    endpoint: ""
    samplerate: 0.1
    servicename: david
version: unknown
