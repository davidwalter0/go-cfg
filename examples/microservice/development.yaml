# Development Environment Configuration

service_name: "user-service"
version: "1.0.0-dev"
environment: "development"
node_id: "dev-node-001"

# API Configuration
api:
  host: "localhost"
  port: 8080
  timeout: "30s"
  rate_limit: 1000
  enable_tls: false

# Database Configuration
database:
  host: "localhost"
  port: 5432
  name: "users_dev"
  username: "dev_user"
  password: "dev_password"
  max_connections: 5
  connection_timeout: "5s"
  query_timeout: "30s"
  ssl_mode: "disable"

# External Services
services:
  auth-service: "http://localhost:8081"
  email-service: "http://localhost:8082"
  notification-service: "http://localhost:8083"

# Feature Flags
features:
  auth: true
  metrics: true
  tracing: true
  caching: false
  debug_logging: true

# Service Discovery
discovery:
  enabled: false
  endpoints: []
  namespace: "development"

# Observability
metrics:
  enabled: true
  endpoint: "/metrics"
  port: 9090
  scrape_interval: "15s"

logging:
  level: "debug"
  format: "text"
  output: "stdout"
  max_size_mb: 50
  max_backups: 2

tracing:
  enabled: true
  endpoint: "http://localhost:14268/api/traces"
  sample_rate: 1.0
  service_name: "user-service-dev"

# Resource Limits
resources:
  max_memory_mb: 256
  max_cpu_cores: 1
  timeout: "2m"

# Security Settings
security:
  jwt_secret: "dev-secret-key-not-for-production"
  jwt_expiration: "1h"
  enable_cors: true
  cors_origins: ["http://localhost:3000", "http://localhost:8080"]
  rate_limit:
    enabled: false
    requests_per_second: 1000
    burst: 2000